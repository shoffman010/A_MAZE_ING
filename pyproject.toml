[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "2.2.0"
description = "Reusable maze generation tools for A-Maze-ing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "stehoffm" },
    { name = "archowdh" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
maze-gen = "mazegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
